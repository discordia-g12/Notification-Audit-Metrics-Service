services:
  notification_service:
    build: .
    container_name: discordia_notification_service
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@notification_db:5432/notification_db
    depends_on:
      notification_db:
        condition: service_healthy

  notification_db:
    image: postgres:16-alpine
    container_name: discordia_notification_db
    ports:
      - "5434:5432" # desde el host: npm run dev con DATABASE_URL en localhost:5434
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
